<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f8f8f6;color:#1a1a1a;min-height:100vh}
.layout{display:flex;height:100vh;overflow:hidden}

/* LEFT: CATALOG */
.catalog{width:420px;flex-shrink:0;border-right:1px solid #e5e5e0;overflow-y:auto;padding:20px}
h1{font-size:18px;font-weight:700;margin-bottom:2px;letter-spacing:-0.3px}
.subtitle{font-size:12px;color:#888;margin-bottom:14px}
.stats{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.stat{background:#fff;border:1px solid #e5e5e0;border-radius:8px;padding:7px 12px;font-size:12px;color:#666}
.stat b{display:block;font-size:16px;font-weight:600;color:#1a1a1a}
input[type=search]{width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;background:#fff;color:#1a1a1a;margin-bottom:10px;outline:none}
input[type=search]:focus{border-color:#6c63ff}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pill{padding:4px 10px;border-radius:999px;border:1px solid #ddd;font-size:11px;cursor:pointer;background:#fff;color:#555;transition:all .15s}
.pill:hover{border-color:#6c63ff;color:#6c63ff}
.pill.on{background:#eeecff;color:#534AB7;border-color:#AFA9EC}
.grid{display:flex;flex-direction:column;gap:8px}
.card{background:#fff;border:1px solid #e5e5e0;border-radius:12px;padding:14px;cursor:pointer;transition:all .15s}
.card:hover{border-color:#6c63ff;box-shadow:0 2px 8px rgba(108,99,255,0.08)}
.card.active{border-color:#6c63ff;border-width:2px;background:#fafaff}
.card.done{border-left:3px solid #1D9E75}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px}
.card-name{font-size:13px;font-weight:600;color:#1a1a1a;flex:1;margin-right:8px}
.badge{font-size:10px;padding:2px 7px;border-radius:999px;white-space:nowrap;font-weight:500}
.b-low{background:#eaf3de;color:#3B6D11}
.b-med{background:#faeeda;color:#854F0B}
.b-hi{background:#faece7;color:#993C1D}
.b-done{background:#e1f5ee;color:#0F6E56}
.sector-tag{font-size:11px;color:#888;margin-bottom:6px}
.modules{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:10px}
.mod{font-size:10px;padding:2px 6px;background:#f3f3f0;color:#555;border-radius:4px}
.cta{width:100%;padding:7px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;border:none}
.cta-generate{background:#6c63ff;color:#fff}
.cta-generate:hover{background:#534AB7}
.cta-generate:disabled{background:#c5c2f0;cursor:not-allowed}
.cta-copy{background:#f3f3f0;color:#333;border:1px solid #ddd;margin-top:4px}
.cta-copy:hover{background:#e8e8e5}
.empty{text-align:center;padding:40px;color:#999;font-size:14px}

/* RIGHT: GENERATOR PANEL */
.panel{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#fff}
.panel-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#aaa;gap:12px}
.panel-empty svg{width:48px;height:48px;stroke:#ddd;fill:none;stroke-width:1.5}
.panel-empty p{font-size:14px}
.panel-header{padding:16px 20px;border-bottom:1px solid #e5e5e0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.panel-title{font-size:15px;font-weight:600}
.panel-sector{font-size:12px;color:#888;margin-top:2px}
.panel-actions{display:flex;gap:8px}
.btn-dl{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid #ddd;background:#fff;cursor:pointer;transition:all .15s}
.btn-dl:hover{background:#f3f3f0;border-color:#6c63ff;color:#6c63ff}
.btn-dl:disabled{opacity:0.4;cursor:not-allowed}
.panel-content{flex:1;overflow-y:auto;padding:20px}
.spec-output{font-family:'Courier New',monospace;font-size:13px;line-height:1.7;white-space:pre-wrap;color:#1a1a1a}
.spec-output h1,.spec-output h2,.spec-output h3{font-family:system-ui,sans-serif}
.generating{display:flex;align-items:center;gap:10px;color:#6c63ff;font-size:13px;padding:20px 0}
.dot{width:8px;height:8px;border-radius:50%;background:#6c63ff;animation:pulse 1s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,60%,100%{opacity:1;transform:scale(1)}30%{opacity:.4;transform:scale(.7)}}
.progress-bar{height:3px;background:#eeecff;border-radius:999px;overflow:hidden;margin-bottom:16px}
.progress-fill{height:100%;background:#6c63ff;border-radius:999px;transition:width .3s;width:0%}
.layer-badge{display:inline-block;background:#eeecff;color:#534AB7;font-size:10px;font-weight:600;padding:2px 8px;border-radius:999px;margin-bottom:8px}

/* Markdown-rendered output */
.md h1{font-size:20px;font-weight:700;margin:20px 0 10px;color:#1a1a1a;border-bottom:2px solid #6c63ff;padding-bottom:6px}
.md h2{font-size:16px;font-weight:600;margin:18px 0 8px;color:#1a1a1a}
.md h3{font-size:14px;font-weight:600;margin:14px 0 6px;color:#333}
.md p{margin:6px 0;line-height:1.6;font-size:13px}
.md ul,.md ol{margin:6px 0 6px 20px;font-size:13px;line-height:1.6}
.md code{background:#f3f3f0;border-radius:4px;padding:1px 5px;font-family:monospace;font-size:12px}
.md pre{background:#f3f3f0;border-radius:8px;padding:12px;overflow-x:auto;margin:8px 0}
.md pre code{background:none;padding:0;font-size:12px}
.md table{border-collapse:collapse;width:100%;font-size:12px;margin:8px 0}
.md td,.md th{border:1px solid #e5e5e0;padding:6px 10px;text-align:left}
.md th{background:#f8f8f6;font-weight:600}
.md blockquote{border-left:3px solid #6c63ff;padding:8px 14px;background:#fafaff;margin:8px 0;font-size:13px;color:#555}
.md hr{border:none;border-top:1px solid #e5e5e0;margin:16px 0}
</style>

## Capa 00 · Visión y Contexto
**Propósito**: Sistema de gestión integral para colmados y tiendas de alimentación familiares en España. Centraliza POS, stock, pedidos a proveedor y delivery online en una sola app accesible desde tablet o móvil.

**Problema que resuelve**: El propietario no sabe cuánto ha vendido hasta que cuenta la caja. El stock se controla a ojo, los pedidos al mayorista se hacen de memoria y los pedidos de delivery llegan por canales distintos sin registro.

**Usuarios**: Propietario/encargado (acceso total), Dependiente (POS + cobro), Repartidor (solo pedidos asignados).

**Marco regulatorio**: Ley 37/1992 IVA · RD 1619/2012 Facturación · RGPD · Ley 28/2005 tabaco · Prohibición venta alcohol/tabaco a menores.

---

## Capa 01 · Glosario de Dominio
- **PVP**: Precio de Venta al Público con IVA incluido. Nunca se muestra sin IVA al cliente.
- **Ticket**: Documento fiscal emitido en cada venta. Obligatorio desde 2023 con IVA desglosado por tipo.
- **Fondo de caja**: Importe inicial en caja al abrir el turno. Base para el arqueo final.
- **Descuadre**: Diferencia entre el total esperado en caja y el dinero real contado al cierre.
- **Stock mínimo**: Umbral configurable por producto. Al alcanzarlo se genera alerta y se añade al pedido sugerido.
- **FIFO**: First In First Out. El lote más antiguo se consume primero. Obligatorio para productos con caducidad.
- **Albarán**: Documento de entrega del proveedor. Se registra al recibir mercancía y se concilia con el pedido.
- **Merma**: Pérdida de stock por caducidad, rotura o error. Requiere ajuste manual con motivo registrado.

---

## Capa 03 · Reglas de Negocio
- **RN-001**: Todo ticket debe incluir base imponible e IVA desglosado por tipo (4%, 10%, 21%). Fuente: RD 1619/2012 Art. 7.
- **RN-002**: Los tickets se numeran secuencialmente sin saltos. La numeración no se reinicia a mitad de ejercicio. Fuente: RD 1619/2012 Art. 6.
- **RN-003**: IVA alimentación básica (pan, leche, huevos, fruta, verdura, legumbres, cereales, queso, aceite, pasta): 4%. Fuente: Ley 37/1992 Art. 91.
- **RN-004**: IVA alimentación no básica (conservas, zumos, agua embotellada, snacks, carne, pescado, bebidas sin alcohol): 10%.
- **RN-005**: IVA bebidas alcohólicas, tabaco, perfumería, limpieza, bazar: 21%.
- **RN-006**: Venta de alcohol y tabaco a menores de 18 años: PROHIBIDA. El sistema muestra aviso de verificación de edad. La confirmación queda registrada en el log de la venta. Fuente: Ley 28/2005.
- **RN-007**: El stock se descuenta automáticamente al cerrar cada venta. No puede quedar en negativo.
- **RN-008**: Los pedidos a proveedor requieren aprobación del propietario antes de enviarse. Los auxiliares solo pueden proponer.

---

## Capa 04 · Invariantes
- **INV-001**: El total de un ticket siempre = suma de líneas con IVA incluido. Nunca se almacena un total inconsistente.
- **INV-002**: El stock de cualquier producto nunca puede ser negativo.
- **INV-003**: Un ticket anulado queda registrado con motivo y usuario. Nunca se elimina físicamente.
- **INV-004**: La numeración de tickets es secuencial sin saltos dentro del mismo ejercicio fiscal.
- **INV-005**: Un turno de caja no puede cerrarse sin registrar el fondo inicial de apertura.

---

## Capa 06 · Políticas de Decisión
**Tabla: Tipo de IVA por categoría**
| Categoría | IVA |
|-----------|-----|
| Pan, leche, huevos, fruta, verdura, legumbre, cereal, queso, aceite, pasta | 4% |
| Carne, pescado, conservas, agua, zumos, snacks, bebidas sin alcohol | 10% |
| Bebidas alcohólicas, tabaco, perfumería, limpieza, bazar | 21% |

**Tabla: ¿Puede completarse la venta?**
| Condición | Resultado |
|-----------|-----------|
| Stock suficiente + edad confirmada si aplica | COMPLETAR |
| Stock insuficiente | BLOQUEAR + aviso |
| Alcohol/tabaco sin confirmar edad | BLOQUEAR hasta confirmar |
| Caja no abierta (sin fondo) | BLOQUEAR toda venta |

---

## Capa 10 · Workflow Principal — Venta en mostrador
1. Dependiente abre turno introduciendo fondo de caja
2. Escanea productos con lector de código de barras o busca por nombre
3. Si alcohol/tabaco: aviso verificación edad → dependiente confirma → queda en log
4. Sistema muestra subtotal con IVA desglosado en tiempo real
5. Cliente elige forma de pago (efectivo / tarjeta / mixto)
6. Si efectivo: dependiente introduce importe → sistema calcula cambio
7. Dependiente cierra venta → sistema descuenta stock (FIFO)
8. Sistema genera e imprime ticket numerado con IVA desglosado
9. Si stock de algún producto cae bajo mínimo → alerta al propietario

---

## Capa 11 · Criterios de Aceptación
- **AC-001**: DADO un producto de fruta con PVP 2€ / CUANDO se añade al ticket / ENTONCES la base es 1,92€ y la cuota IVA 4% es 0,08€
- **AC-002**: DADO una venta de cerveza / CUANDO el dependiente no ha confirmado la edad / ENTONCES el sistema bloquea el cierre de venta
- **AC-003**: DADO un producto con stock 0 / CUANDO se intenta añadir al ticket / ENTONCES el sistema muestra "Sin stock" y bloquea la línea
- **AC-004**: DADO el cierre de turno / CUANDO el dependiente cuenta 150€ y el sistema espera 152€ / ENTONCES el descuadre registrado es -2€ con nota obligatoria
- **AC-005**: DADO un ticket anulado / CUANDO el propietario lo anula con motivo / ENTONCES el ticket permanece en el histórico con estado "anulado" y el stock se repone`,

## Capa 00 · Visión y Contexto
**Propósito**: Sistema de gestión para bares y cafeterías españolas. Gestiona comandas por mesa, pantalla de cocina, caja y cierre diario con facturación IVA correcta.

**Problema**: Los camareros anotan en papel, los errores de comanda son diarios y al cierre no cuadran los números.

**Usuarios**: Camarero (POS + comandas), Cocinero (pantalla cocina, solo lectura), Encargado (caja + informes + anulaciones), Propietario (acceso total).

**Marco regulatorio**: Ley 37/1992 IVA · RD 1619/2012 Facturación · IVA hostelería 10% general · IVA bebidas alcohólicas 21%.

---

## Capa 01 · Glosario de Dominio
- **Comanda**: Pedido de una mesa. Contiene líneas de producto con cantidad y observaciones.
- **Mesa**: Unidad física de servicio. Tiene número, capacidad y estado (libre/ocupada/pendiente de cobro).
- **Ticket de mesa**: Documento fiscal generado al cobrar. Incluye todas las consumiciones de la mesa.
- **Pantalla de cocina (KDS)**: Display en cocina que muestra las comandas en tiempo real. Solo lectura.
- **Turno**: Período de trabajo de un camarero. Tiene apertura, ventas asociadas y cierre.
- **Invitación**: Línea de comanda marcada como cortesía. No suma al total pero queda registrada.
- **Descuadre**: Diferencia entre ventas registradas y dinero en caja al cierre.

---

## Capa 03 · Reglas de Negocio
- **RN-001**: IVA comida en hostelería: 10%. IVA bebidas alcohólicas: 21%. IVA bebidas sin alcohol (refrescos, agua, café): 10%. Fuente: Ley 37/1992.
- **RN-002**: Una mesa no puede tener dos comandas abiertas simultáneamente.
- **RN-003**: Solo el encargado o propietario puede anular una línea de comanda ya enviada a cocina.
- **RN-004**: Las invitaciones (cortesías) deben registrarse con motivo y usuario que las autoriza.
- **RN-005**: El ticket debe emitirse en el momento del cobro. No se puede cobrar sin generar ticket.
- **RN-006**: La factura completa (con datos del cliente) se emite solo a petición expresa y requiere NIF del cliente.
- **RN-007**: El cierre de caja requiere: fondo inicial registrado + todas las mesas cerradas + recuento manual confirmado.

---

## Capa 04 · Invariantes
- **INV-001**: Una mesa en estado "libre" no puede tener comandas abiertas.
- **INV-002**: El total de un ticket = suma de líneas con IVA. Nunca inconsistente.
- **INV-003**: Una comanda enviada a cocina no puede modificarse — solo añadir líneas nuevas o anular con autorización.
- **INV-004**: El stock de bebidas se descuenta al cerrar la mesa, no al crear la comanda.
- **INV-005**: Ningún ticket puede eliminarse — solo anularse con registro del motivo.

---

| Anular línea enviada | ✗ | ✗ | ✓ | ✓ |
| Cobrar mesa | ✓ | ✗ | ✓ | ✓ |
| Ver informe de caja | ✗ | ✗ | ✓ | ✓ |
| Marcar invitación | ✗ | ✗ | ✓ | ✓ |

## Capa 10 · Workflow Principal — Servicio de mesa
1. Camarero selecciona mesa libre → mesa pasa a "ocupada"
2. Camarero añade productos a la comanda (búsqueda por nombre o categoría)
3. Camarero envía comanda → aparece en pantalla de cocina con timestamp
4. Cocina prepara y marca ítem como "listo"
5. Camarero ve ítems listos en su dispositivo
6. Cliente pide la cuenta → camarero genera pre-cuenta (no fiscal)
7. Cliente confirma → camarero selecciona forma de pago
8. Sistema genera ticket fiscal con IVA desglosado → imprime
9. Mesa vuelve a estado "libre" → stock decrementado

- **AC-001**: DADO una comanda con 2 cervezas (3€ c/u) y 1 ración de jamón (12€) / CUANDO se cobra / ENTONCES el ticket muestra: base 10% = 12€, IVA 10% = 1,20€, base 21% = 6€, IVA 21% = 1,26€, total = 20,46€
- **AC-002**: DADO una comanda enviada a cocina / CUANDO el camarero intenta borrar una línea / ENTONCES el sistema bloquea y pide autorización del encargado
- **AC-003**: DADO una mesa libre / CUANDO se intenta cobrar / ENTONCES el sistema bloquea con mensaje "Mesa sin comanda abierta"

- **AC-005**: DADO una invitación marcada por el encargado / CUANDO se genera el ticket / ENTONCES la invitación aparece a 0€ con nota "Invitación" pero el producto queda registrado en el consumo`,

## Capa 00 · Visión y Contexto
**Propósito**: Sistema de gestión para farmacias comunitarias en España. Gestiona dispensación (con y sin receta), stock, facturación al SNS y trazabilidad de medicamentos.

**Usuarios**: Farmacéutico Titular (responsable legal, acceso total), Auxiliar de Farmacia (POS + dispensación), Administrativo (facturación, solo lectura stock).

**Marco regulatorio**: Ley 29/2006 garantías medicamentos · RD 1345/2007 autorización medicamentos · RD 1675/2012 receta médica · Directiva 2011/62/UE falsificados (serialización) · RGPD categoría especial (datos salud) · Normativa autonómica.

---

## Capa 01 · Glosario de Dominio
- **CNP**: Código Nacional de Producto. Identificador único de cada medicamento en España.
- **EFP**: Especialidad Farmacéutica Publicitaria. Se vende sin receta.
- **Receta**: Prescripción médica que autoriza la dispensación de un medicamento con receta.
- **Dispensación**: Acto de entregar un medicamento al paciente. Queda registrada obligatoriamente.
- **PVP**: Precio de Venta al Público fijado por el Ministerio de Sanidad para medicamentos financiados.
- **Copago**: Importe que paga el paciente según su condición (activo/pensionista/renta).
- **SNS**: Sistema Nacional de Salud. Financia los medicamentos de la prestación farmacéutica.
- **Lote**: Unidad de trazabilidad. Cada lote tiene número, caducidad y cantidad.

---

## Capa 03 · Reglas de Negocio
- **RN-001**: Medicamentos clasificados "con receta" JAMÁS pueden dispensarse sin receta válida. Sin excepción. Fuente: Ley 29/2006 Art. 77.
- **RN-002**: IVA medicamentos de uso humano: 4%. Productos sanitarios/prótesis/gafas: 10%. Parafarmacia/cosmética: 21%. Fuente: Ley 37/1992 Art. 91.
- **RN-003**: Los medicamentos financiados tienen PVP máximo fijado por BOE. No se puede vender por encima.
- **RN-004**: Estupefacientes: requieren receta oficial en papel de 2 hojas. Cada dispensación se registra en el libro oficial con: fecha, paciente (nombre+DNI), médico, cantidad.
- **RN-005**: Caducidad mínima en recepción: 6 meses desde fecha de entrada. Lotes con menos generan alerta de rechazo.
- **RN-006**: FIFO obligatorio: el lote más antiguo se consume primero.
- **RN-007**: Serialización obligatoria: medicamentos de lista serializable requieren verificación del código DataMatrix en el SEVEM antes de dispensar. Fuente: Directiva 2011/62/UE.

---

## Capa 04 · Invariantes
- **INV-001**: Un medicamento con receta NUNCA puede dispensarse sin receta válida en el sistema. Violarlo es ilegal.
- **INV-002**: El stock de cualquier referencia nunca puede ser negativo.
- **INV-003**: Cada dispensación queda registrada con: producto, lote, cantidad, paciente (si aplica), usuario que dispensó, timestamp.
- **INV-004**: Un lote caducado no puede dispensarse — el sistema lo bloquea automáticamente.
- **INV-005**: El copago del paciente nunca puede ser mayor que el PVP del medicamento.

---

## Capa 06 · Políticas de Decisión
**Tabla: ¿Puede dispensarse el medicamento?**
| Tipo dispensación | Receta válida | Stock | Resultado |
|-------------------|--------------|-------|-----------|
| EFP (sin receta) | No aplica | Sí | DISPENSAR |
| EFP (sin receta) | No aplica | No | BLOQUEAR |
| Con receta | Sí, válida | Sí | DISPENSAR |
| Con receta | No/caducada | Cualquiera | BLOQUEAR SIEMPRE |
| Estupefaciente | Papel oficial | Sí | DISPENSAR + registro |
| Estupefaciente | Electrónica | Cualquiera | BLOQUEAR SIEMPRE |

**Tabla: Copago SNS (simplificado)**
| Condición | % Copago | Tope/envase |
|-----------|----------|-------------|
| Activo renta < 18.000€ | 40% | 4,24€ |
| Activo renta > 100.000€ | 60% | 4,24€ |
| Pensionista renta < 18.000€ | 10% | 1,42€ |
| Parado larga duración | 0% | 0€ |

---

## Capa 10 · Workflow Principal — Venta con receta electrónica
1. Cliente presenta TSI (tarjeta sanitaria)
2. Auxiliar consulta recetas activas del paciente en el sistema de la CCAA
3. Sistema muestra recetas pendientes y medicamentos prescritos
4. Auxiliar selecciona receta a dispensar
5. Sistema verifica: receta válida, no caducada, no dispensada ya
6. Sistema verifica stock disponible
7. Si medicamento serializado: escanea DataMatrix → verifica en SEVEM → marca como dispensado
8. Sistema calcula copago según condición del paciente registrada en CCAA
9. Auxiliar dispensa, cobra el copago, imprime resguardo
10. Sistema cierra receta en el sistema de la CCAA
11. Dispensación queda registrada para liquidación mensual al SNS

---

## Capa 11 · Criterios de Aceptación
- **AC-001**: DADO un medicamento con receta / CUANDO el auxiliar intenta dispensarlo sin receta en el sistema / ENTONCES el sistema bloquea con "Receta obligatoria — no se puede dispensar"
- **AC-002**: DADO un lote caducado ayer / CUANDO se intenta dispensar / ENTONCES el sistema bloquea automáticamente y alerta al farmacéutico
- **AC-003**: DADO un pensionista con renta < 18.000€ comprando medicamento de 20€ PVP / CUANDO se calcula el copago / ENTONCES el copago es 1,42€ (tope aplicado: 10% = 2€ > tope 1,42€)
- **AC-004**: DADO un estupefaciente con receta electrónica / CUANDO el auxiliar intenta dispensarlo / ENTONCES el sistema bloquea: "Estupefacientes requieren receta oficial en papel"
- **AC-005**: DADO una alerta de retirada de mercado de AEMPS para un CNP / CUANDO el sistema la recibe / ENTONCES bloquea todos los lotes afectados y genera alerta urgente al farmacéutico titular`,

// ── OPEN PANEL ──────────────────────────────────────────────
function selectNegocio(enc){
  const nombre = decodeURIComponent(enc);
  currentNegocio = NEGOCIOS.find(n=>n.nombre===nombre);
  if(!currentNegocio) return;
  document.getElementById('panel-empty').style.display='none';
  const pa = document.getElementById('panel-active');
  pa.style.display='flex';
  document.getElementById('panel-title').textContent = currentNegocio.nombre;
  document.getElementById('panel-sector').textContent = currentNegocio.sector + ' · Complejidad ' + currentNegocio.complejidad;
  document.getElementById('btn-dl').disabled = true;
  document.getElementById('btn-copy').disabled = true;
  generatedSpec = '';
  render();

  // Si tiene spec pre-generada, la carga al instante
  if(PREGENERATED[currentNegocio.nombre]){
    generatedSpec = PREGENERATED[currentNegocio.nombre];
    setProgress(100);
    renderMarkdown(generatedSpec);
    document.getElementById('btn-dl').disabled = false;
    document.getElementById('btn-copy').disabled = false;
    setTimeout(()=>setProgress(0), 600);
  } else {
    generateSpec();
  }
}

// ── GENERATE WITH API ────────────────────────────────────────
async function generateSpec(){
  if(!currentNegocio || generating) return;
  generating = true;
  generatedSpec = '';
  render();

  const content = document.getElementById('panel-content');
  content.innerHTML = `<div class="generating"><div class="dot"></div><div class="dot"></div><div class="dot"></div><span>Generando specs para <strong>${currentNegocio.nombre}</strong>…</span></div>`;
  setProgress(5);

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 4000,
        messages: [{role:'user', content: buildPrompt(currentNegocio)}]
      })
    });

    setProgress(30);

    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      content.innerHTML = `<div style="color:#f43f5e;padding:20px;font-size:14px">Error ${res.status}: ${err.error?.message || 'Error de conexión. Comprueba tu clave de API.'}</div>`;
      generating = false; render(); return;
    }

    const data = await res.json();
    setProgress(90);
    const text = data.content?.find(b=>b.type==='text')?.text || '';
    generatedSpec = text;
    setProgress(100);
    renderMarkdown(text);

    document.getElementById('btn-dl').disabled = false;
    document.getElementById('btn-copy').disabled = false;

  } catch(e) {
    content.innerHTML = `<div style="color:#f43f5e;padding:20px;font-size:14px">Sin conexión. Comprueba el internet e inténtalo de nuevo.</div>`;
  }

  generating = false;
  render();
  setTimeout(()=>setProgress(0), 800);
}

// ── RENDER MARKDOWN ──────────────────────────────────────────
function renderMarkdown(md){
  let html = md
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/^---$/gm, '<hr>')
    .replace(/^\> (.+)$/gm, '<blockquote>$1</blockquote>')
    .replace(/^\- (.+)$/gm, '<li>$1</li>')
    .replace(/^(\d+)\. (.+)$/gm, '<li>$2</li>')
    .replace(/(<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`)
    .replace(/\n\n/g, '</p><p>')
    .replace(/^(?!<[a-z])/gm, '');

  document.getElementById('panel-content').innerHTML = `<div class="md"><p>${html}</p></div>`;
}

// ── UTILS ────────────────────────────────────────────────────
function setProgress(pct){
  document.getElementById('progress').style.width = pct + '%';
}

function downloadSpec(){
  if(!generatedSpec || !currentNegocio) return;
  const slug = currentNegocio.nombre.toLowerCase().replace(/[^a-z0-9]+/g,'-');
  const blob = new Blob([generatedSpec], {type:'text/markdown'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `SPECTRA-${slug}.md`;
  a.click();
}

function copySpec(){
  if(!generatedSpec) return;
  navigator.clipboard.writeText(generatedSpec).then(()=>{
    const btn = document.getElementById('btn-copy');
    const orig = btn.textContent;
    btn.textContent = '✓ Copiado';
    setTimeout(()=>btn.textContent=orig, 2000);
  });
}
