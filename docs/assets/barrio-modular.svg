<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 800" width="1000" height="800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Barrio modular: core, horizontales, verticales y bus de eventos">
<style>
:root{--paper:#fbfcfa;--ink:#16282b;--muted:#5b6e70;--line:#b9c6c6;--core:#f2b441;--core-ink:#2a1d00;--horiz:#1f7a7a;--horiz-ink:#f4fffe;--awn:#d96f4a;--flow:#3f3fd6;--bus:#7f9496;--font:system-ui,-apple-system,Segoe UI,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--paper:#162427;--ink:#e6efee;--muted:#8fa3a4;--line:#2c4144;--core:#d9a032;--core-ink:#1b1405;--horiz:#2aa3a0;--horiz-ink:#04201f;--awn:#e07a56;--flow:#9aa0ff;--bus:#587072}}
text{fill:var(--ink);font-family:var(--font)}
.mono{font-family:var(--mono)}
.street{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:2 7}
.bus{fill:none;stroke:var(--bus);stroke-width:3;stroke-dasharray:10 8}
.conn{stroke:var(--bus);stroke-width:2.5}.conn.hot{stroke:var(--flow)}
.ref{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:1 4;stroke-linecap:round}
.flow{fill:none;stroke:var(--flow);stroke-width:5;stroke-linecap:round;stroke-dasharray:12 9}
.core{fill:var(--core)}
.coretitle{fill:var(--core-ink);font-weight:800;font-size:30px;letter-spacing:.04em}
.coresub{fill:var(--core-ink);font-size:10.5px}
.hbody{fill:var(--horiz)}
.dashed .hbody{fill:none;stroke:var(--horiz);stroke-width:2;stroke-dasharray:6 5}
.htxt{fill:var(--horiz-ink);font-weight:700;font-size:16px}
.hsub{fill:var(--horiz-ink);font-size:10.5px}
.dashed .htxt,.dashed .hsub{fill:var(--ink)}
.lockic{fill:var(--horiz-ink);stroke:var(--horiz-ink);stroke-width:1.6}
.dashed .lockic{fill:var(--ink);stroke:var(--ink)}
.shopbody{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}
.shop.dashed .shopbody{stroke-dasharray:5 4;stroke:var(--muted)}
.awn{fill:url(#awnp)}
.shoptxt{font-weight:700;font-size:14px}
.shop.dashed .shoptxt{fill:var(--muted)}
.mk{fill:var(--flow)}.mkt{fill:var(--paper);font-weight:500;font-size:12px}
.evt{fill:var(--flow);font-size:11.5px;font-weight:500}
.bl{fill:var(--muted);font-size:11px;letter-spacing:.18em}
</style>
<rect width="1000" height="800" style="fill:var(--paper)"/>
<defs>
<pattern id="awnp" width="16" height="13" patternUnits="userSpaceOnUse"><rect width="8" height="13" style="fill:var(--awn)"/><rect x="8" width="8" height="13" style="fill:var(--paper)"/></pattern>
<g id="lock"><rect x="0" y="6" width="12" height="9" rx="2"/><path d="M3 6V4a3 3 0 0 1 6 0v2" fill="none"/></g>
</defs>
<circle cx="500" cy="400" r="385" class="street"/>
<circle cx="500" cy="400" r="275" class="bus"/>
<path id="busl" d="M266.8 545.7 A275 275 0 0 0 370.9 642.8" fill="none"/><text class="mono bl"><textPath href="#busl" dy="-7">BUS DE EVENTOS</textPath></text>
<line x1="376.8" y1="102.5" x2="394.8" y2="145.9" class="conn hot"/>
<line x1="623.2" y1="102.5" x2="605.2" y2="145.9" class="conn"/>
