<g transform="translate(306.0 57.3)" class="shop"><rect width="124" height="48" rx="6" class="shopbody"/><rect width="124" height="13" rx="6" class="awn"/><rect y="7" width="124" height="6" class="awn"/><text x="62" y="35" text-anchor="middle" class="shoptxt">Peluquería</text></g>
