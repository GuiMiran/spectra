<line x1="500" y1="188" x2="500" y2="125" class="conn"/>
<line x1="500" y1="312" x2="500" y2="242" class="ref"/>
<line x1="759" y1="400" x2="775" y2="400" class="conn"/>
<line x1="588" y1="400" x2="611" y2="400" class="ref"/>
<line x1="500" y1="612" x2="500" y2="675" class="conn"/>
<line x1="500" y1="488" x2="500" y2="558" class="ref"/>
<line x1="241" y1="400" x2="225" y2="400" class="conn"/>
<line x1="412" y1="400" x2="389" y2="400" class="ref"/>
<path d="M394.8 146.0 A275 275 0 0 1 500 125" class="flow"/>
<path d="M500 125 A275 275 0 0 1 775 400" class="flow"/>
<line x1="376.8" y1="102.5" x2="394.8" y2="146.0" class="flow"/>
<line x1="759" y1="400" x2="775" y2="400" class="flow"/>
<circle cx="500" cy="400" r="88" class="core"/>
<text x="500" y="394" text-anchor="middle" class="coretitle">CORE</text>
<text x="500" y="416" text-anchor="middle" class="mono coresub">empresas · terceros</text>
<text x="500" y="430" text-anchor="middle" class="mono coresub">productos · roles</text>
<text x="500" y="444" text-anchor="middle" class="mono coresub">licencias · auditoría</text>
<g class="horiz"><rect x="426" y="188" width="148" height="54" rx="10" class="hbody"/><use href="#lock" x="436" y="195" class="lockic"/><text x="506" y="212" text-anchor="middle" class="htxt">Facturación</text><text x="506" y="230" text-anchor="middle" class="mono hsub">MVP · demo charla</text></g>
