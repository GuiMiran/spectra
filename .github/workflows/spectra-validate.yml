name: Spectra Validator

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-verify:
    name: Verify Node contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify repository and run tests
        run: npm run verify

      - name: Assess Stage 2 fixture
        run: npm run stage2:assess -- --input evals/stage2-pass.json

      - name: Assess trajectory fixture
        run: npm run trajectory:assess -- --input evals/trajectory-pass.json --controls evals/trajectory-controls.json

      - name: Assess oracle and signal-path fixtures
        run: |
          npm run assurance:assess -- oracle evals/oracle-integrity-pass.json
          npm run assurance:assess -- signal evals/signal-path-pass.json

      - name: Audit retired Azure DevOps YAML tasks
        run: npm run audit:azure-tasks -- .

  spectra-validate:
    name: Validate Spectra specs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Spectra validator
        run: python .github/scripts/spectra_validator.py

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spectra-validation-report
          path: spectra-report.md
