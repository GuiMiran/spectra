name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to check or stage
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Create GitHub Release and stage on npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run Spectra validator (must pass before release)
        run: python .github/scripts/spectra_validator.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Extract version from tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Release tag must match package.json (v$version)."
            exit 1
          fi
          echo "VERSION=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          # Try to find section in CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk "/^## \[?${VERSION#v}\]?/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Release $VERSION — see commit history for details."
          fi
          # Write to file to handle multi-line
          echo "$NOTES" > release-notes.txt

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "Spectra ${{ steps.version.outputs.VERSION }}"
          body_path: release-notes.txt
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}

      - name: Stage unpublished version on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          package="@guimiran/spectra@$version"
          status=$(curl --silent --show-error --retry 2 --max-time 20 \
            --output /dev/null --write-out '%{http_code}' \
            "https://registry.npmjs.org/@guimiran%2Fspectra/$version")

          case "$status" in
            200)
              echo "$package is already published."
              exit 0
              ;;
            404) ;;
            *)
              echo "::error::npm registry returned HTTP $status while checking $package."
              exit 1
              ;;
          esac

          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "::error::NPM_TOKEN is required to stage $package."
            exit 1
          fi

          tag=latest
          if [[ "$version" == *-* ]]; then
            tag=next
          fi

          npm install --global npm@11.21.3
          chmod +x bin/spectra.js
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            npm stage publish --access public --tag "$tag" --provenance
          else
            npm stage publish --access public --tag "$tag"
          fi
          echo "::notice::Review and approve $package in npm Staged Packages."
